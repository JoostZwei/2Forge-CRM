# Fly.io config za 2Forge CRM
# Promijeni "app" u nešto jedinstveno ako je "2forge-crm" zauzeto
app = "2forge-crm"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "crm_data"
  destination = "/data"
  initial_size = "1gb"
